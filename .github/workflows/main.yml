name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ely-Wardrobe-Mod
          path: build/libs/*[!sources].jar
          if-no-files-found: error
```[cite: 1, 11]

### Що виконує цей workflow:
* **JDK 21 Temurin:** Встановлює відповідну версію Java для Minecraft 1.21.1[cite: 1, 11].
* **Права на запуск (`chmod +x`):** Запобігає помилці `Permission Denied` при виклику `./gradlew` у Linux[cite: 1, 11].
* **Збірка (`./gradlew build`):** Компілює мод у чистій конфігурації без фонового демона[cite: 11].
* **Завантаження артефакту:** Зберігає готовий `.jar` файл мода (виключаючи jar із вихідним кодом `-sources.jar`) у розділі дій репозиторію[cite: 1, 11].
